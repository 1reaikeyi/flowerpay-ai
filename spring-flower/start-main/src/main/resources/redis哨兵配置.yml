spring:
  # redis配置文件
  data:
    redis:
      # 主从节点访问密码（哨兵模式下不再需要配置 host/port）
      password: ${flower.redis.password}
      # 数据库索引（0~15，主从及哨兵需保持一致）
      database: ${flower.redis.database}
      timeout: 3000ms
      sentinel:
        # 主节点名称，必须与 redis-sentinel.conf 中 "sentinel monitor <name> ..." 一致
        master: mymaster
        nodes:
          - 192.168.80.128:263790
          - 192.168.80.129:263791
          - 192.168.80.130:263792
        password: ${flower.redis.password}
