spring:
  # redis配置文件
  data:
    redis:
      # 集群节点访问密码（所有节点需一致）
      password: ${flower.redis.password}
      # 命令执行超时
      timeout: 3000ms
      # 集群只支持 0 号库，不能沿用 flower.redis.database
      database: 0
      cluster:
        nodes:
          # 主节点
          - 192.168.80.128:7001
          - 192.168.80.128:7002
          - 192.168.80.128:7003
          # 从节点（每个主节点的副本，需与对应主节点不在同一台机器）
          - 192.168.80.128:27011
          - 192.168.80.128:27012
          - 192.168.80.128:27013
