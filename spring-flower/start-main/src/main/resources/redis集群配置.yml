spring:
  # redis配置文件
  data:
    redis:
      # 集群节点访问密码（所有节点需一致）
      password: ${flower.redis.password}
      # 命令执行超时
      timeout: 3000ms
      # 集群只支持 0 号库，不能沿用 flower.redis.database
      database: 0
      cluster:
        nodes:
          # 主节点
          - 192.168.80.128:63790
          - 192.168.80.128:63791
          - 192.168.80.128:63792
          # 从节点（每个主节点的副本，需与对应主节点不在同一台机器）
          - 192.168.80.128:263790
          - 192.168.80.128:263791
          - 192.168.80.128:263792
