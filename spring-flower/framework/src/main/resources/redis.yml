spring:
  # redis配置文件
  data:
    redis:
      host: ${flower.redis.host}
      port: ${flower.redis.port}
      password: ${flower.redis.password}
      database: ${flower.redis.database}
      timeout: 3000ms
      redisson:
        config: |
          singleServerConfig:
            # Redis 连接地址（必须带 redis:// 协议前缀）
            address: "redis://${flower.redis.host}:${flower.redis.port}"
            # 数据库索引
            database: ${flower.redis.database}
            # 访问密码
            password: ${flower.redis.password}
            # 连接池大小
            connectionPoolSize: 10
            # 最小空闲连接数
            connectionMinimumIdleSize: 2
            # 连接空闲超时（毫秒），超时后关闭空闲连接
            idleConnectionTimeout: 10000
            # 连接建立超时（毫秒）
            connectTimeout: 10000
            # 命令执行超时（毫秒）
            timeout: 3000
            # 命令失败重试次数
            retryAttempts: 3
            # 命令失败重试间隔（毫秒）
            retryInterval: 1500
