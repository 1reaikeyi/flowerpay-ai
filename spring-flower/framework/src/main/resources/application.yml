#端口
server:
  port: ${port}
# 日志配置
logging:
  level:
    root: ${logging.record:info}
    org.springframework.web: ${logging.web:info}
    org.springframework.web.bind: ${logging.web:info}
# springIOC
spring:
  # 项目配置文件
  profiles:
    active: dev
  # 缓存配置
  cache:
    type: redis
    redis:
      cache-null-values: false
  # 文件上传配置
  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 10MB
  # 导入文件
  config:
    import: classpath:redis.yml,classpath:mysql.yml


# jwt配置
jwt:
  # 设置jwt签名加密时使用的秘钥
  admin-secret-key: huawei_secret_for_spring_security_generation_as_jwt_to_use_admin
  # 设置jwt过期时间
  admin-ttl: 864000000
  # 设置前端传递过来的令牌名称
  admin-token-name: token
  # 设置jwt签名加密时使用的秘钥
  user-secret-key: huawei_secret_for_spring_security_generation_as_jwt_to_use_user
  # 设置jwt过期时间
  user-ttl: 864000000
  # 设置前端传递过来的令牌名称
  user-token-name: token
# 阿里云OSS配置
alioss:
  #文件上传配置
  endpoint: https://oss-cn-beijing.aliyuncs.com
  # 阿里云身份凭证ID（相当于“账号”）
  access-key-id: ${PATH_alibaba_oss_id}
  # 阿里云身份凭证密钥（相当于“密码”）
  access-key-secret: ${PATH_alibaba_oss_secret}
  # 阿里云OSS 存储空间名称（相当于“网盘文件夹”）
  bucket-name: java-web-ai-wangnian
# 支付宝支付配置
alipay:
  gatewayUrl: ${flower.alipay.gateway-url:https://openapi-sandbox.dl.alipaydev.com/gateway.do}
  app-id: ${PATH_alibaba_pay_appid}
  app-private-key: ${PATH_alibaba_pay_private}
  alipay-public-key: ${PATH_alibaba_pay_public}
  format: ${flower.alipay.format:JSON}
  charset: ${flower.alipay.charset:UTF-8}
  signType: ${flower.alipay.sign-type:RSA2}
  # 必填：回调地址（notify必须公网可访问；return给前端页面）
  notify-url: https://localhost:${port}/pay/notify
  return-url: http://localhost:${port}}/pay/return




