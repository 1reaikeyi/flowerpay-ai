#端口
server:
  port: ${port}
# 日志配置
logging:
  level:
    root: ${logging.record:info}
    org.springframework.web: ${logging.web:info}
    org.springframework.web.bind: ${logging.web:info}
# springIOC
spring:
  # 项目配置文件
  profiles:
    active: dev
  # 缓存配置
  cache:
    type: redis
    redis:
      cache-null-values: false
  # 文件上传配置
  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 10MB
  # 导入文件
  config:
    import: classpath:redis.yml,classpath:mysql.yml






